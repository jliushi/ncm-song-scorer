name: deploy-play-worker

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "workers/play.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-play.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/worker.test.mjs

      - name: Deploy play worker (skip when no Cloudflare token)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::未配置 CLOUDFLARE_API_TOKEN secret，跳过 Worker 部署（播放走官网外链兜底）"
            exit 0
          fi
          npx --yes wrangler@4.147.0 deploy
