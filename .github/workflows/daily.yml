name: daily-collect

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['scripts/**', 'ncm_scorer/**', '.github/workflows/daily.yml']
  schedule:
    # UTC 01:30 = 北京时间 09:30（避开整点调度高峰；Actions cron 允许数分钟级延迟）
    - cron: "30 1 * * *"

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATA_REPO: ${{ github.repository_owner }}/ncm-scorer-data
      DATA_TOKEN: ${{ secrets.DATA_PUSH_TOKEN }}
      PLAY_API: ${{ vars.PLAY_API || 'https://ncm-scorer-play.2383566697.workers.dev/' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Verify offline behavior
        run: python -m unittest discover -s tests -q

      - name: Restore database
        run: |
          set -e
          if git clone --depth 1 "https://x-access-token:${DATA_TOKEN}@github.com/${DATA_REPO}.git" data_repo; then
            if [ -f data_repo/ncm_scorer.db ]; then
              cp data_repo/ncm_scorer.db .
              echo "restored db: $(du -h ncm_scorer.db | cut -f1)"
            else
              echo "::error::数据库缺失；停止运行，避免用空库替换历史数据"
              exit 1
            fi
            # 已训练的模型（若 train workflow 产出过）一并恢复，用于每日 ML 打分
            if [ -f data_repo/model.pkl ]; then
              cp data_repo/model.pkl data_repo/model.pkl.meta.json . 2>/dev/null || true
              echo "restored model"
            fi
          else
            echo "::error::无法恢复历史数据库；保留上次发布结果"
            exit 1
          fi

      - name: Run daily collection
        if: github.event_name != 'push'
        run: python scripts/daily.py

      - name: Build ranking page
        run: python scripts/build_site.py --db ncm_scorer.db --out site/index.html --top 50

      - name: Write ranking to job summary
        run: |
          {
            echo "## 新歌 Top 20（$(date -u '+%F %T') UTC）"
            echo '```'
            python -m ncm_scorer top -n 20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist database
        if: github.event_name != 'push'
        run: |
          set -e
          cd data_repo
          cp ../ncm_scorer.db .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ncm_scorer.db
          if ! git diff --cached --quiet; then git commit -m "daily snapshot $(date -u +%F)"; fi
          git push -u origin main

      - name: Publish ranking site to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add index.html
          git commit -q -m "ranking site $(date -u '+%F %T')"
          git push -q -f origin gh-pages
